function bodyDistance(x,z,entity,fallen){
 const px=entity.g.position.x,pz=entity.g.position.z;
 if(!fallen)return Math.hypot(x-px,z-pz);
 // Al girar el modelo 90 grados alrededor de Z, la cabeza apunta al -X local.

}

// Elegir una dirección viable con visión anticipada; evita esquinas y cuerpos.
function steerAround(x,z,goalX,goalZ,speed,dt,r,exclude,previous=0){
